# Истории эпика в порядке сборки.

[[entry]]
id = 1
type = "story"
title = "Вход и выход через GitHub"
description = "OAuth-поток GitHub с проверкой state, таблица пользователей по GitHub user id, подписанная сессия на 7 дней из SESSION_SECRET; без входа страницы заметок перенаправляют на вход, в шапке логин и кнопка «Выйти»; общая тестовая фикстура входа под заданным пользователем через подменённый GitHub, существующие тесты переводятся на неё."
verify = "Тесты с подменённым GitHub: вход создаёт пользователя и сессию, после выхода главная перенаправляет на вход; вручную — вход реальным аккаунтом на 127.0.0.1:8000 показывает логин в шапке."
covers = ["CAP-1", "CAP-3"]
after = []
hitl = true        # ручная проверка входа реальным GitHub-аккаунтом
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Заметки принадлежат пользователю"
description = "Колонка owner_id в notes с миграцией без потери данных; список, поиск, просмотр, правка и удаление ограничены текущим пользователем, чужая заметка отвечает 404; owner_id допускает NULL — прежние заметки после миграции остаются без владельца до записи 3, create_note принимает необязательного владельца, чтобы seed.py продолжал работать."
verify = "Тест: заметка A не видна B в списке, поиске и по URL просмотра, правки и удаления (404); миграция на копии базы со старой схемой сохраняет все заметки."
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Прежние заметки — первому пользователю"
description = "Заметки без владельца принадлежат первому зарегистрированному пользователю и переходят к нему при его входе; seed.py пишет заметки первому пользователю, если он есть, иначе без владельца, и удаляет только заметки того, кому пишет."
verify = "Тест: база с заметками без владельца — первый вошедший видит их все, второй ни одной; seed.py при существующем пользователе создаёт заметки ему и не трогает заметки второго."
covers = ["CAP-4"]
after = [2]
hitl = false
risk = "medium"
